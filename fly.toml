app = "ssh-battleships"
primary_region = "lhr"

[build]

[[services]]
  protocol = "tcp"
  internal_port = 2222
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 22

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40
